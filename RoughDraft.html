<title>Big West WBB Analytics — Coach's Dashboard</title>
<style>
  :root{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF1F9; --surface-3:#E3E9F6;
    --border:#D8DEEC; --ink:#131B2E; --ink-muted:#5B6684; --ink-faint:#8992AC;
    --accent:#C98A00; --accent-ink:#FFFFFF; --accent-soft:#FBEBCC;
    --series-a:#C98A00; --series-b:#2569C7;
    --good:#159A6C; --good-soft:#E1F5EC; --critical:#D93B52; --critical-soft:#FBE4E8;
    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(19,27,46,.06), 0 8px 24px -12px rgba(19,27,46,.12);
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0A0F1C; --surface:#111A2E; --surface-2:#17233D; --surface-3:#1D2A48;
      --border:#263252; --ink:#F2F4F8; --ink-muted:#8D97B5; --ink-faint:#5B6685;
      --accent:#FFC94A; --accent-ink:#1A1200; --accent-soft:#3A2E0E;
      --series-a:#C68600; --series-b:#3E8EED;
      --good:#38C793; --good-soft:#123528; --critical:#F1596B; --critical-soft:#3A1620;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0F1C; --surface:#111A2E; --surface-2:#17233D; --surface-3:#1D2A48;
    --border:#263252; --ink:#F2F4F8; --ink-muted:#8D97B5; --ink-faint:#5B6685;
    --accent:#FFC94A; --accent-ink:#1A1200; --accent-soft:#3A2E0E;
    --series-a:#C68600; --series-b:#3E8EED;
    --good:#38C793; --good-soft:#123528; --critical:#F1596B; --critical-soft:#3A1620;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF1F9; --surface-3:#E3E9F6;
    --border:#D8DEEC; --ink:#131B2E; --ink-muted:#5B6684; --ink-faint:#8992AC;
    --accent:#C98A00; --accent-ink:#FFFFFF; --accent-soft:#FBEBCC;
    --series-a:#C98A00; --series-b:#2569C7;
    --good:#159A6C; --good-soft:#E1F5EC; --critical:#D93B52; --critical-soft:#FBE4E8;
    --shadow:0 1px 2px rgba(19,27,46,.06), 0 8px 24px -12px rgba(19,27,46,.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-weight:800; letter-spacing:-.01em; }
  .eyebrow{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-muted);
  }

  .app{ display:grid; grid-template-columns:236px 1fr; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--accent);
    color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; flex:none;
  }
  .brand-text{ line-height:1.2; }
  .brand-text b{ display:block; font-size:13.5px; font-weight:800; }
  .brand-text span{ font-size:11px; color:var(--ink-muted); }

  nav.views{ display:flex; flex-direction:column; gap:2px; }
  .nav-label{ padding:0 10px 6px; }
  .nav-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:9px 10px; border-radius:var(--radius-sm); border:none; background:none;
    color:var(--ink-muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .nav-btn .ic{ width:18px; height:18px; flex:none; opacity:.85; }
  .nav-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--ink); }
  .nav-btn.active .ic{ opacity:1; }
  .nav-btn:focus-visible, .btn:focus-visible, select:focus-visible, .card-select:focus-visible, .th-sort:focus-visible{
    outline:2px solid var(--series-b); outline-offset:2px;
  }

  .sidebar-foot{ margin-top:auto; padding:10px 8px; border-top:1px solid var(--border); }
  .sidebar-foot .eyebrow{ margin-bottom:4px; }
  .sidebar-foot p{ margin:0; font-size:11.5px; color:var(--ink-faint); }

  /* ---------- Main / topbar ---------- */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:18px 28px; display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
  }
  .topbar h1{ font-size:21px; }
  .topbar .sub{ margin-top:3px; font-size:12.5px; color:var(--ink-muted); }
  .topbar-controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  select{
    appearance:none; -webkit-appearance:none; background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B6684"/></svg>') no-repeat right 10px center;
    border:1px solid var(--border); color:var(--ink); font-weight:600; font-size:12.5px;
    padding:8px 28px 8px 12px; border-radius:var(--radius-sm); cursor:pointer;
  }
  select.vs{ }
  .vslabel{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }

  .view{ padding:22px 28px 60px; display:flex; flex-direction:column; gap:20px; }

  /* ---------- Cards / grid ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 18px 16px;
  }
  .card-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .card-title h3{ font-size:14px; }
  .card-title .hint{ font-size:11.5px; color:var(--ink-faint); font-weight:500; }

  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:10px; }
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; box-shadow:var(--shadow);
  }
  .tile .eyebrow{ margin-bottom:6px; }
  .tile .val{ font-size:24px; font-weight:800; }
  .tile .val small{ font-size:13px; font-weight:700; color:var(--ink-muted); margin-left:2px; }
  .tile .delta{ margin-top:4px; font-size:11.5px; font-weight:700; }
  .tile .delta.up{ color:var(--good); } .tile .delta.down{ color:var(--critical); }

  .grid-2{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:980px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

  /* ---------- Table ---------- */
  .table-wrap{ overflow-x:auto; border-radius:var(--radius-sm); border:1px solid var(--border); }
  table{ width:100%; border-collapse:collapse; min-width:640px; font-size:12.8px; }
  thead th{
    position:sticky; top:0; background:var(--surface-2); text-align:left; padding:9px 12px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted);
    border-bottom:1px solid var(--border); white-space:nowrap; font-weight:700;
  }
  th.th-sort{ cursor:pointer; user-select:none; background:none; border:none; font:inherit; text-transform:inherit; letter-spacing:inherit; color:inherit; padding:0; }
  th.num, td.num{ text-align:right; }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:default; }
  tbody tr.clickable{ cursor:pointer; }
  tbody tr.clickable:hover{ background:var(--surface-2); }
  tbody tr.selected{ background:var(--accent-soft); }
  .rowname{ font-weight:700; }
  .muted{ color:var(--ink-muted); }

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px;
    font-size:11px; font-weight:800; letter-spacing:.02em;
  }
  .pill.win{ background:var(--good-soft); color:var(--good); }
  .pill.loss{ background:var(--critical-soft); color:var(--critical); }
  .pill.tag{ background:var(--surface-3); color:var(--ink-muted); font-weight:700; }

  .jersey{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:22px;
    border-radius:5px; background:var(--surface-3); font-family:var(--font-mono); font-weight:700;
    font-size:11.5px; color:var(--ink-muted); flex:none;
  }

  /* ---------- Buttons / misc ---------- */
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:7px 12px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.link{ border:none; background:none; color:var(--series-b); padding:0; font-weight:700; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--ink-muted); }
  .swatch{ width:9px; height:9px; border-radius:2px; flex:none; }

  /* ---------- Player / Team roster cards ---------- */
  .roster-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; }
  .player-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:10px;
    text-align:left;
  }
  .player-card:hover{ border-color:var(--series-b); }
  .player-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .pc-head{ display:flex; align-items:center; gap:8px; }
  .pc-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
    color:var(--ink-muted); flex:none;
  }
  .pc-name{ font-weight:800; font-size:13px; line-height:1.2; }
  .pc-meta{ font-size:11px; color:var(--ink-faint); font-weight:600; }
  .pc-stats{ display:flex; gap:10px; }
  .pc-stat b{ display:block; font-size:15px; font-weight:800; font-family:var(--font-mono); }
  .pc-stat span{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }

  /* ---------- Player detail ---------- */
  .pdetail-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pdetail-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; flex:none;
  }
  .pdetail-name{ font-size:19px; }
  .pdetail-meta{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .pdetail-meta b{ color:var(--ink); }

  /* ---------- Compare layout ---------- */
  .compare-heads{ display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; }
  .compare-side{ display:flex; align-items:center; gap:10px; }
  .compare-side.right{ flex-direction:row-reverse; text-align:right; }
  .compare-avatar{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none; }
  .compare-vs{ font-family:var(--font-mono); font-weight:800; color:var(--ink-faint); font-size:12px; }
  .compare-name{ font-weight:800; font-size:14px; }
  .compare-meta{ font-size:11px; color:var(--ink-faint); font-weight:600; }

  .diffrow{ display:grid; grid-template-columns:64px 1fr 88px 1fr 64px; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--border); }
  .diffrow:last-child{ border-bottom:none; }
  .diffrow .stat-label{ text-align:center; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); }
  .diffval{ font-family:var(--font-mono); font-weight:800; font-size:13px; }
  .bar-track{ position:relative; height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .bar-track.left{ direction:rtl; }
  .bar-fill{ position:absolute; top:0; bottom:0; border-radius:99px; }
  .bar-fill.a{ background:var(--series-a); left:0; }
  .bar-fill.b{ background:var(--series-b); left:0; }
  .diffrow.left-wins .diffval.a{ color:var(--series-a); }
  .diffrow.right-wins .diffval.b{ color:var(--series-b); }

  /* ---------- Charts ---------- */
  .chart-wrap{ position:relative; }
  svg.chart{ display:block; width:100%; height:auto; overflow:visible; }
  .gridline{ stroke:var(--border); stroke-width:1; }
  .axislabel{ fill:var(--ink-faint); font-size:9.5px; font-family:var(--font-mono); }
  .tooltip{
    position:absolute; pointer-events:none; background:var(--ink); color:var(--bg);
    padding:6px 9px; border-radius:6px; font-size:11px; font-weight:700; white-space:nowrap;
    transform:translate(-50%,-115%); opacity:0; transition:opacity .1s; z-index:9; box-shadow:var(--shadow);
  }
  .tooltip.show{ opacity:1; }
  .tooltip .t-sub{ font-weight:500; opacity:.75; }
  .hover-x{ stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 3; opacity:0; }
  .hit{ fill:transparent; }

  .barchart-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .barchart-row:last-child{ margin-bottom:0; }
  .barchart-label{ width:78px; flex:none; font-size:11px; font-weight:700; color:var(--ink-muted); }
  .barchart-track{ flex:1; display:flex; gap:3px; align-items:center; height:16px; }
  .barchart-bar{ height:16px; border-radius:4px; }
  .barchart-val{ width:44px; flex:none; font-family:var(--font-mono); font-weight:800; font-size:12px; text-align:right; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">BW</div>
      <div class="brand-text"><b>Big West WBB</b><span>Analytics — mock data</span></div>
    </div>

    </div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="tooltip" id="tooltip"></div>

*/

function makePlayers(rows){
  // row: [num,name,pos,gp,min,fgm,fga,tpm,tpa,ftm,fta,oreb,dreb,ast,stl,blk,to,pts]
  return rows.map(r=>({
    num:r[0], name:r[1], pos:r[2], gp:r[3], min:r[4],
    fgm:r[5], fga:r[6], tpm:r[7], tpa:r[8], ftm:r[9], fta:r[10],
    oreb:r[11], dreb:r[12], ast:r[13], stl:r[14], blk:r[15], to:r[16], pts:r[17],
  }));
}
function makeGames(rows){
  // row: [date,opp,home(1/0),ptsFor,ptsAgainst,fgm,fga,reb,ast,to]
  return rows.map(r=>({
    date:r[0], opp:r[1], home:!!r[2], pf:r[3], pa:r[4],
    fgm:r[5], fga:r[6], reb:r[7], ast:r[8], to:r[9], win:r[3]>r[4],
  }));
}

/* ============================= DERIVED STATS ============================= */
function pct(m,a){ return a>0 ? (m/a*100) : 0; }
function fmtPct(m,a){ return a>0 ? (m/a*100).toFixed(1)+'%' : '—'; }
function avg(sum,gp){ return gp>0 ? sum/gp : 0; }
function fmt1(n){ return n.toFixed(1); }

function seasonTotals(team){
  const p = team.players;
  const sum = k => p.reduce((s,x)=>s+x[k],0);
  const gp = Math.max(...p.map(x=>x.gp));
  const totals = {
    gp, fgm:sum('fgm'), fga:sum('fga'), tpm:sum('tpm'), tpa:sum('tpa'),
    ftm:sum('ftm'), fta:sum('fta'), oreb:sum('oreb'), dreb:sum('dreb'),
    ast:sum('ast'), stl:sum('stl'), blk:sum('blk'), to:sum('to'), pts:sum('pts'),
  };
  totals.reb = totals.oreb + totals.dreb;
  const g = team.games;
  const record = { w:g.filter(x=>x.win).length, l:g.filter(x=>!x.win).length };
  const oppPts = g.reduce((s,x)=>s+x.pa,0)/Math.max(g.length,1);
  return {...totals, record, gpFromGames:g.length, ppg:avg(totals.pts,gp), rpg:avg(totals.reb,gp),
    apg:avg(totals.ast,gp), topg:avg(totals.to,gp), stlpg:avg(totals.stl,gp), blkpg:avg(totals.blk,gp),
    oppPpg:oppPts, fgPct:pct(totals.fgm,totals.fga), tpPct:pct(totals.tpm,totals.tpa), ftPct:pct(totals.ftm,totals.fta)};
}

function playerPerGame(pl){
  return {
    ppg:avg(pl.pts,pl.gp), rpg:avg(pl.oreb+pl.dreb,pl.gp), apg:avg(pl.ast,pl.gp),
    stlpg:avg(pl.stl,pl.gp), blkpg:avg(pl.blk,pl.gp), topg:avg(pl.to,pl.gp),
    fgPct:pct(pl.fgm,pl.fga), tpPct:pct(pl.tpm,pl.tpa), ftPct:pct(pl.ftm,pl.fta), mpg:pl.min/pl.gp,
  };
}
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join(''); }

/* Deterministic pseudo-random per-game series for a player's trend
   sparkline (illustrative only until real per-game rows are wired in). */
function seededSeries(seed, n, mean, spread){
  let s = seed;
  const rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
  return Array.from({length:n},()=> Math.max(0, Math.round(mean + (rnd()-.5)*2*spread)));
}

/* ============================= LINE CHART (trend) ============================= */
function lineChart(games, w, h){
  const pad = {l:30,r:14,t:14,b:22};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const vals = games.flatMap(g=>[g.pf,g.pa]);
  const max = Math.ceil(Math.max(...vals)/10)*10 + 5;
  const min = Math.max(0, Math.floor(Math.min(...vals)/10)*10 - 5);
  const x = i => pad.l + (games.length===1?0:i/(games.length-1))*iw;
  const y = v => pad.t + ih - ((v-min)/(max-min))*ih;
  const path = arr => arr.map((g,i)=> (i===0?'M':'L')+x(i).toFixed(1)+','+y(g).toFixed(1)).join(' ');
  const gridY = [0,.25,.5,.75,1].map(t=> min + t*(max-min));

  const pts = games.map((g,i)=>`<circle class="pt-a" cx="${x(i)}" cy="${y(g.pf)}" r="3" fill="var(--series-a)" data-i="${i}"/>
    <circle class="pt-b" cx="${x(i)}" cy="${y(g.pa)}" r="3" fill="var(--series-b)" data-i="${i}"/>`).join('');
  const hitW = games.length>1 ? iw/(games.length-1) : iw;

  return `<div class="chart-wrap" data-chart="trend">
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
      ${gridY.map(v=>`<line class="gridline" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axislabel" x="2" y="${y(v)+3}">${Math.round(v)}</text>`).join('')}
      <path d="${path(games.map(g=>g.pf))}" fill="none" stroke="var(--series-a)" stroke-width="2"/>
      <path d="${path(games.map(g=>g.pa))}" fill="none" stroke="var(--series-b)" stroke-width="2" stroke-dasharray="4 3"/>
      ${pts}
      <line id="hoverline" class="hover-x" x1="0" x2="0" y1="${pad.t}" y2="${h-pad.b}"/>
      ${games.map((g,i)=>`<rect class="hit" x="${x(i)-hitW/2}" y="${pad.t}" width="${hitW}" height="${ih}" data-i="${i}"/>`).join('')}
    </svg>
  </div>`;
}
function wireTrendChart(container, games){
  const wrap = container.querySelector('[data-chart="trend"]');
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const tooltip = document.getElementById('tooltip');
  const hoverline = wrap.querySelector('#hoverline');
  svg.querySelectorAll('.hit').forEach(hit=>{
    hit.addEventListener('mouseenter', ()=>{
      const i = +hit.dataset.i, g = games[i];
      const cA = svg.querySelector(`.pt-a[data-i="${i}"]`), cB = svg.querySelector(`.pt-b[data-i="${i}"]`);
      hoverline.setAttribute('x1', cA.getAttribute('cx')); hoverline.setAttribute('x2', cA.getAttribute('cx'));
      hoverline.style.opacity = 1;
      const rect = svg.getBoundingClientRect(), wrapRect = wrap.getBoundingClientRect();
      const px = rect.left - wrapRect.left + (cA.getAttribute('cx')/svg.viewBox.baseVal.width)*rect.width;
      const py = rect.top - wrapRect.top + (cA.getAttribute('cy')/svg.viewBox.baseVal.height)*rect.height;
      tooltip.innerHTML = `<div>${g.win?'W':'L'} ${g.pf}–${g.pa} <span class="t-sub">vs ${g.opp}</span></div>`;
      tooltip.style.left = px+'px'; tooltip.style.top = py+'px';
      const wrapAbs = wrap.getBoundingClientRect();
      tooltip.style.transform = 'translate(-50%,-125%)';
      tooltip.style.left = (wrapAbs.left+px)+'px'; tooltip.style.top = (wrapAbs.top+py)+'px';
      tooltip.classList.add('show');
    });
    hit.addEventListener('mouseleave', ()=>{ hoverline.style.opacity=0; tooltip.classList.remove('show'); });
  });
}

      <div class="tile"><div class="eyebrow">STL</div><div class="val num">${fmt1(pg.stlpg)}</div></div>
      <div class="tile"><div class="eyebrow">BLK</div><div class="val num">${fmt1(pg.blkpg)}</div></div>
      <div class="tile"><div class="eyebrow">FG%</div><div class="val num">${pg.fgPct.toFixed(1)}</div></div>
      <div class="tile"><div class="eyebrow">3P%</div><div class="val num">${pg.tpPct.toFixed(1)}</div></div>
      <div class="tile"><div class="eyebrow">FT%</div><div class="val num">${pg.ftPct.toFixed(1)}</div></div>
    </div>

    <div class="card-title" style="margin-top:18px;"><h3>Points, game by game</h3><span class="hint">Illustrative trend</span></div>
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:120px">
      <path d="${areaPath}" fill="var(--series-a)" opacity=".12"/>
      <path d="${path}" fill="none" stroke="var(--series-a)" stroke-width="2"/>
      ${series.map((v,i)=>i===series.length-1?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--series-a)"/>`:'').join('')}
    </svg>
  </div>`;
}
function wireRoster(container){
  container.querySelectorAll('.player-card').forEach(btn=>btn.addEventListener('click',()=>{
    state.selectedPlayer = {team:state.team, idx:+btn.dataset.idx}; render();
    document.getElementById('player-detail')?.scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
  container.querySelector('#close-detail')?.addEventListener('click',()=>{ state.selectedPlayer=null; render(); });
}

/* ============================= VIEW: COMPARE PLAYERS ============================= */
const CP_STATS = [
  {key:'ppg', label:'PPG', fmt:fmt1, max:30},
  {key:'rpg', label:'RPG', fmt:fmt1, max:14},
  {key:'apg', label:'APG', fmt:fmt1, max:9},
  {key:'stlpg', label:'STL', fmt:fmt1, max:3.5},
  {key:'blkpg', label:'BLK', fmt:fmt1, max:2.5},
  {key:'topg', label:'TO', fmt:fmt1, max:4.5, lowerBetter:true},
  {key:'fgPct', label:'FG%', fmt:v=>v.toFixed(1), max:65},
  {key:'tpPct', label:'3P%', fmt:v=>v.toFixed(1), max:50},
  {key:'ftPct', label:'FT%', fmt:v=>v.toFixed(1), max:100},
];
function playerPickerOptions(){
  return TEAM_KEYS.map(tk=>`<optgroup label="${TEAMS[tk].name}">${TEAMS[tk].players.map((p,i)=>
    `<option value="${tk}|${i}">#${p.num} ${p.name}</option>`).join('')}</optgroup>`).join('');
}
function viewComparePlayers(){
  const p1 = TEAMS[state.p1.team].players[state.p1.idx], pg1 = playerPerGame(p1);
  const p2 = TEAMS[state.p2.team].players[state.p2.idx], pg2 = playerPerGame(p2);
  return `
    <div class="card">
      <div class="compare-heads">
        <div class="compare-side">
          <div class="compare-avatar" style="background:color-mix(in srgb, var(--series-a) 22%, var(--surface-3));color:var(--series-a)">${initials(p1.name)}</div>
          <div><select id="p1-pick">${playerPickerOptions()}</select><div class="compare-name" style="margin-top:6px;">${p1.name}</div><div class="compare-meta">#${p1.num} ${p1.pos} · ${TEAMS[state.p1.team].name}</div></div>
        </div>
        <div class="compare-vs">VS</div>
        <div class="compare-side right">
          <div class="compare-avatar" style="background:color-mix(in srgb, var(--series-b) 22%, var(--surface-3));color:var(--series-b)">${initials(p2.name)}</div>
          <div><select id="p2-pick">${playerPickerOptions()}</select><div class="compare-name" style="margin-top:6px;">${p2.name}</div><div class="compare-meta">#${p2.num} ${p2.pos} · ${TEAMS[state.p2.team].name}</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Per-game averages</h3>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background:var(--series-a)"></span>${p1.name.split(' ').slice(-1)}</span>
          <span class="legend-item"><span class="swatch" style="background:var(--series-b)"></span>${p2.name.split(' ').slice(-1)}</span>
        </div>
      </div>
      ${CP_STATS.map(s=>{
        const v1=pg1[s.key], v2=pg2[s.key];
        const aBetter = s.lowerBetter ? v1<v2 : v1>v2;
        const bBetter = s.lowerBetter ? v2<v1 : v2>v1;
        const w1 = Math.min(100, v1/s.max*100), w2 = Math.min(100, v2/s.max*100);
        return `<div class="diffrow ${aBetter?'left-wins':''} ${bBetter?'right-wins':''}">
          <div class="diffval a" style="text-align:right;">${s.fmt(v1)}</div>
          <div class="bar-track left"><div class="bar-fill a" style="width:${w1}%"></div></div>
          <div class="stat-label">${s.label}</div>
          <div class="bar-track"><div class="bar-fill b" style="width:${w2}%"></div></div>
          <div class="diffval b">${s.fmt(v2)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function wireComparePlayers(container){
  const p1 = container.querySelector('#p1-pick'), p2 = container.querySelector('#p2-pick');
  p1.value = state.p1.team+'|'+state.p1.idx; p2.value = state.p2.team+'|'+state.p2.idx;
  p1.addEventListener('change', e=>{ const [t,i]=e.target.value.split('|'); state.p1={team:t,idx:+i}; render(); });
  p2.addEventListener('change', e=>{ const [t,i]=e.target.value.split('|'); state.p2={team:t,idx:+i}; render(); });
}

/* ============================= VIEW: COMPARE TEAMS ============================= */
const CT_COUNTING = [
  {key:'ppg', label:'PPG', max:85}, {key:'oppPpg', label:'Opp PPG', max:85},
  {key:'rpg', label:'RPG', max:45}, {key:'apg', label:'APG', max:22}, {key:'topg', label:'TOPG', max:20},
];
const CT_SHOOTING = [ {key:'fgPct', label:'FG%'}, {key:'tpPct', label:'3P%'}, {key:'ftPct', label:'FT%'} ];

function ctBar(label, v1, v2, max, unitPct){
  const w1 = Math.min(100, v1/max*100), w2 = Math.min(100, v2/max*100);
  return `<div class="barchart-row"><div class="barchart-label">${label}</div>
    <div class="barchart-track"><div class="barchart-bar" style="background:var(--series-a);width:${w1}%"></div></div>
    <div class="barchart-val" style="color:var(--series-a)">${v1.toFixed(1)}${unitPct?'%':''}</div></div>
  <div class="barchart-row"><div class="barchart-label"></div>
    <div class="barchart-track"><div class="barchart-bar" style="background:var(--series-b);width:${w2}%"></div></div>
    <div class="barchart-val" style="color:var(--series-b)">${v2.toFixed(1)}${unitPct?'%':''}</div></div>`;
}

function viewCompareTeams(){
  const t1 = TEAMS[state.t1], t2 = TEAMS[state.t2];
  const s1 = seasonTotals(t1), s2 = seasonTotals(t2);
  return `
    <div class="card">
      <div class="compare-heads">
        <div class="compare-side">
          <div class="compare-avatar" style="background:color-mix(in srgb, var(--series-a) 22%, var(--surface-3));color:var(--series-a);font-size:11px;">${t1.short}</div>
          <div>${teamSelect('t1-pick', state.t1, {mascot:true})}<div class="compare-name" style="margin-top:6px;">${t1.name}</div><div class="compare-meta">${s1.record.w}-${s1.record.l} · ${t1.mascot}</div></div>
        </div>
        <div class="compare-vs">VS</div>
        <div class="compare-side right">
          <div class="compare-avatar" style="background:color-mix(in srgb, var(--series-b) 22%, var(--surface-3));color:var(--series-b);font-size:11px;">${t2.short}</div>
          <div>${teamSelect('t2-pick', state.t2, {mascot:true})}<div class="compare-name" style="margin-top:6px;">${t2.name}</div><div class="compare-meta">${s2.record.w}-${s2.record.l} · ${t2.mascot}</div></div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title"><h3>Season averages</h3><span class="hint">points / rebounds / assists / turnovers per game</span></div>
        ${CT_COUNTING.map(c=>ctBar(c.label, s1[c.key], s2[c.key], c.max, false)).join('')}
      </div>
      <div class="card">
        <div class="card-title"><h3>Shooting splits</h3><span class="hint">field goal / three / free throw %</span></div>
        ${CT_SHOOTING.map(c=>ctBar(c.label, s1[c.key], s2[c.key], 100, true)).join('')}
      </div>
    </div>
  `;
}
function wireCompareTeams(container){
  container.querySelector('#t1-pick').addEventListener('change', e=>{ state.t1=e.target.value; render(); });
  container.querySelector('#t2-pick').addEventListener('change', e=>{ state.t2=e.target.value; render(); });
}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  renderNav();
  renderTopbar();
  const root = document.getElementById('view');
  if(state.view==='overview'){ root.innerHTML = viewOverview(); wireTrendChart(root, TEAMS[state.team].games); }
  else if(state.view==='gamelog'){ root.innerHTML = viewGameLog(); wireGameLog(root); }
  else if(state.view==='roster'){ root.innerHTML = viewRoster(); wireRoster(root); }
  else if(state.view==='cplayers'){ root.innerHTML = viewComparePlayers(); wireComparePlayers(root); }
  else if(state.view==='cteams'){ root.innerHTML = viewCompareTeams(); wireCompareTeams(root); }
}
render();
</script>
